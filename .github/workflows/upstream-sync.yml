# Upstream sync — turn a Renovate pi bump into our own reconciling PR.
#
# Renovate bumps upstream.nix (it never auto-merges that pin, see renovate.json).
# This job then:
#   1. diffs the two npm releases (.github/upstream-sync/diff.sh);
#   2. has the NEW pi read that diff and edit the module, via the homelab
#      LiteLLM (.github/upstream-sync/prompt.md holds its instructions);
#   3. runs `nix fmt` + `nix flake check` on the result;
#   4. opens `pi-sync/v<version>` stacked on the Renovate commit, or comments
#      "no changes needed" on the Renovate PR (.github/upstream-sync/publish.sh).
#
# Trust boundary. The runner is self-hosted, so only same-repo Renovate PRs
# (or a maintainer's manual dispatch) reach it. The upstream diff is untrusted
# text, so the agent gets no shell tool and no GitHub token: the App token is
# minted only after the agent step, and a secret-leak check runs before push.
#
# flake.lock is never written here (org policy: deps-flake-lock.yml is its only
# writer). The job evaluates against the latest llm-agents with
# --override-input, then dispatches the relock workflow.
#
# One-time setup: runner labels in vars.PI_SYNC_RUNNER (JSON array), and in the
# `automation` environment vars.LITELLM_BASE_URL, vars.PI_SYNC_MODEL,
# secrets.LITELLM_API_KEY, vars.GH_APP_CLIENT_ID, secrets.GH_APP_PRIVATE_KEY.

name: Upstream sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [upstream.nix]
  workflow_dispatch:
    inputs:
      from:
        description: pi version the module currently matches
        required: true
      to:
        description: pi version to reconcile with (upstream.nix on this ref must already say it)
        required: true

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LATEST_LLM_AGENTS: github:numtide/llm-agents.nix
  WORK: .upstream-sync
  # The only paths the agent may change. Anything else it touches fails the
  # job before staging, so a prompt-injected diff cannot reach workflows,
  # flake.lock or these scripts. The agent is told this list at run time.
  AGENT_PATHS: modules/pi.nix checks preferences.nix README.md

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'renovate[bot]')
    runs-on: ${{ fromJSON(vars.PI_SYNC_RUNNER || '["self-hosted","homelab"]') }}
    environment: automation
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3

      - name: Resolve versions
        id: versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:upstream.nix" > "$RUNNER_TEMP/base-upstream.nix"
            from=$(nix eval --raw -f "$RUNNER_TEMP/base-upstream.nix" version)
          else
            from=$INPUT_FROM
          fi
          to=$(nix eval --raw -f upstream.nix version)
          if [ -n "$INPUT_TO" ] && [ "$INPUT_TO" != "$to" ]; then
            echo "::error::upstream.nix on this ref says $to, not $INPUT_TO"; exit 1
          fi
          packaged=$(nix eval --raw --override-input llm-agents "$LATEST_LLM_AGENTS" .#pi.version)
          echo "from=$from" "to=$to" "packaged=$packaged" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          if [ "$packaged" != "$to" ]; then
            echo "::notice::llm-agents packages pi $packaged, not $to yet; re-run once it catches up."
          fi

      - name: Diff the releases
        if: steps.versions.outputs.packaged == steps.versions.outputs.to
        env:
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        run: .github/upstream-sync/diff.sh "$FROM" "$TO" "$WORK"

      - name: Reconcile with pi
        id: agent
        if: steps.versions.outputs.packaged == steps.versions.outputs.to
        env:
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          PI_SYNC_MODEL: ${{ vars.PI_SYNC_MODEL }}
        run: |
          export PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent
          mkdir -p "$PI_CODING_AGENT_DIR"
          # apiKey is the literal "$LITELLM_API_KEY": pi resolves it from the
          # environment at request time, so the value is never written to disk.
          # shellcheck disable=SC2016
          nix run nixpkgs#jq -- -n --arg url "$LITELLM_BASE_URL" --arg model "$PI_SYNC_MODEL" '{
            providers: { litellm: {
              baseUrl: $url, api: "openai-completions", apiKey: "$LITELLM_API_KEY",
              models: [{ id: $model }]
            } }
          }' > "$PI_CODING_AGENT_DIR/models.json"

          nix run --override-input llm-agents "$LATEST_LLM_AGENTS" .#pi -- \
            --print --no-session --no-approve --offline \
            --no-extensions --no-skills --no-prompt-templates \
            --provider litellm --model "$PI_SYNC_MODEL" \
            --tools read,edit,write,grep,find,ls \
            @.github/upstream-sync/prompt.md "FROM=$FROM TO=$TO" "Editable paths: $AGENT_PATHS"

          test -s "$WORK/SUMMARY.md" || echo "The agent wrote no summary." > "$WORK/SUMMARY.md"
          .github/upstream-sync/stage.sh
          if git diff --cached --quiet; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

      - name: Validate
        id: validate
        if: steps.agent.outputs.changed == 'true'
        run: |
          nix fmt
          .github/upstream-sync/stage.sh
          if nix flake check --override-input llm-agents "$LATEST_LLM_AGENTS" -L > "$RUNNER_TEMP/check.log" 2>&1; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 "$RUNNER_TEMP/check.log"

      - name: Refuse to publish a leaked secret
        if: steps.agent.outcome == 'success'
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          # A file, not a pipe: `grep -q` in a pipeline can SIGPIPE the writer,
          # and under pipefail a found key would then read as "not found".
          published=$RUNNER_TEMP/published.txt
          { git diff --cached; cat "$WORK/SUMMARY.md"; } > "$published"
          if grep -F -- "$LITELLM_API_KEY" "$published" > /dev/null; then
            echo "::error::The LiteLLM key appears in the agent's output; nothing is published."; exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: steps.agent.outcome == 'success'
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Publish
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
          CHANGED: ${{ steps.agent.outputs.changed }}
          CHECK: ${{ steps.validate.outputs.result }}
          RENOVATE_PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: nix shell nixpkgs#gh --command .github/upstream-sync/publish.sh
